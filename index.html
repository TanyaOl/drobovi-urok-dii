<h1>Множення, ділення дробів і степінь (§ 7)</h1>
<p class="mut">Повторюємо все разом на завданнях із підручника (§ 7). Тисни «Наступний крок» і спробуй вгадати крок, перш ніж його відкрити. Олівець і стирачка внизу працюють на всіх вкладках.</p>

<script>
const done=new Set();
const R=s=>{let p;do{p=s;s=s.replace(/\{([^{}|]*)\|([^{}]*)\}/g,'<span class=f><span>$1</span><span>$2</span></span>')}while(p!==s);return s.replace(/\^\{?(-?\w+)\}?/g,'<sup>$1</sup>')};
const P=s=>{s=s.replace(/<\/?s>/g,'');let p;do{p=s;s=s.replace(/\{([^{}|]*)\|([^{}]*)\}/g,'($1)/($2)')}while(p!==s);return s};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rnd(0,a.length-1)],sg=x=>x<0?'−'+(-x):''+x;

/* [назва, умова, кроки, відповідь] */
const S=[
{id:'7.1',tab:'7.1',h:'7.1: множення всередині суми',i:'Порядок дій: спочатку множення й ділення, потім додавання й віднімання. Розклади на множники, скороти добуток, і тільки тоді додавай чи віднімай.',quiz:{q:'{5|x}−{2|x^2}·x = ?',o:['{3|x}','{7|x}','{3|x^2}','3x'],c:0,w:'Множення: {2|x^2}·x = {2|x}. Тоді {5|x}−{2|x} = {3|x}.'},t:[
['7.1 (1)','{12a+b|3a}−{7b^2|a^2}·{a|21b}',['Множення першим: {7b^2|a^2}·{a|21b} = {7ab^2|21a^2b} = {b|3a}.','Віднімання з однаковими знаменниками: {12a+b|3a}−{b|3a} = {12a+b−b|3a} = {12a|3a}.','Скорочуємо 12a і 3a.'],'4'],
['7.1 (2)','{m^2−n^2|x^2−9}·{x−3|m−n}−{m|x+3}',['Розкладаємо: m^2−n^2 = (m−n)(m+n); x^2−9 = (x−3)(x+3).','Множимо й скорочуємо (m−n) і (x−3): {m+n|x+3}.','Віднімання: {m+n|x+3}−{m|x+3} = {n|x+3}.'],'{n|x+3}'],
['7.1 (3)','{a−b|2a+b}+{1|a−b}:{2a+b|a^2−b^2}',['Ділення першим. Перевертаємо: {1|a−b}·{a^2−b^2|2a+b}.','a^2−b^2 = (a−b)(a+b). Скорочуємо (a−b): {a+b|2a+b}.','Додавання: {a−b|2a+b}+{a+b|2a+b} = {2a|2a+b}.'],'{2a|2a+b}'],
['7.1 (4)','x−{x^2−xy|x+y}·{x|x−y}',['Множення: x^2−xy = x(x−y). {x(x−y)·x|(x+y)(x−y)} = {x^2|x+y}.','x = {x|1}. Спільний знаменник x+y: {x(x+y)−x^2|x+y}.','x^2+xy−x^2 = xy.'],'{xy|x+y}']]},
{id:'7.2',tab:'7.2–7.3',h:'7.2–7.3: з діленням',i:'Ділення спершу замінюємо множенням, потім як у 7.1. У 7.3 дивись, як літера b зникне сама.',quiz:{q:'{4|b}+{2|b}:{1|2} = ?',o:['{8|b}','{4|b}','{6|b}','{1|b}'],c:0,w:'{2|b}:{1|2} = {2|b}·2 = {4|b}. Тоді {4|b}+{4|b} = {8|b}.'},t:[
['7.2 (1)','{10x+y|5x}−{3y^2|x^2}·{x|15y}',['Множення: {3y^2·x|x^2·15y} = {y|5x}.','Віднімання: {10x+y|5x}−{y|5x} = {10x|5x}.','Скорочуємо на 5x.'],'2'],
['7.2 (2)','{a^2−4|9−b^2}:{a−2|3+b}−{2|3−b}',['Ділення: 9−b^2 = (3−b)(3+b). {(a−2)(a+2)|(3−b)(3+b)}·{3+b|a−2} = {a+2|3−b}.','Віднімання: {a+2|3−b}−{2|3−b} = {a|3−b}.'],'{a|3−b}'],
['7.2 (3)','{x+y|3x−y}+{1|x+y}·{x^2−y^2|3x−y}',['Множення: x^2−y^2 = (x−y)(x+y). Скорочуємо (x+y): {x−y|3x−y}.','Додавання: {x+y|3x−y}+{x−y|3x−y} = {2x|3x−y}.'],'{2x|3x−y}'],
['7.2 (4)','m+{m^2+mn|n−m}·{m|m+n}',['Множення: m^2+mn = m(m+n). Скорочуємо (m+n): {m·m|n−m} = {m^2|n−m}.','m = {m|1}. Спільний знаменник n−m: {m(n−m)+m^2|n−m}.','m(n−m)+m^2 = mn−m^2+m^2 = mn.'],'{mn|n−m}'],
['7.3','{2b|m}+{a^2−b^2|5m^2}·{10m|a+b}, a = 4,5; m = 0,5',['Множення: a^2−b^2 = (a−b)(a+b). {(a−b)(a+b)·10m|5m^2(a+b)} = {2(a−b)|m}.','Додавання: {2b|m}+{2(a−b)|m} = {2b+2a−2b|m} = {2a|m}. Літера b зникла!','Підставляємо a = 4,5; m = 0,5: {2·4,5|0,5} = {9|0,5} = 18.'],'18 годин']]},
{id:'7.4',tab:'7.4',h:'7.4: дужка і множення або ділення',i:'Спочатку дужка: спільний знаменник, один дріб. Потім множення або ділення.',quiz:{q:'(1+{2|x}):{x+2|x} = ?',o:['1','x','{x+2|x}','2'],c:0,w:'1+{2|x} = {x+2|x}. Ділимо однакові дроби, виходить 1.'},t:[
['7.4 (1)','({x|7}+{7|x}+2)·{1|x+7}',['Дужка, спільний знаменник 7x: {x^2+49+14x|7x}.','x^2+14x+49 = (x+7)^2 (квадрат суми).','Множимо: {(x+7)^2|7x}·{1|x+7} = {x+7|7x}.'],'{x+7|7x}'],
['7.4 (2)','(1+{m|3n}):(1−{m|3n})',['Кожна дужка: 1+{m|3n} = {3n+m|3n}; 1−{m|3n} = {3n−m|3n}.','Ділимо: {3n+m|3n}·{3n|3n−m}. Скорочуємо 3n.'],'{3n+m|3n−m}'],
['7.4 (3)','({a|a+2}−3a)·{a+2|a}',['Дужка: {a−3a(a+2)|a+2} = {a−3a^2−6a|a+2} = {−3a^2−5a|a+2} = −{a(3a+5)|a+2}.','Множимо: −{a(3a+5)|a+2}·{a+2|a}. Скорочуємо a та (a+2).'],'−(3a+5)'],
['7.4 (4)','(2+{x|x+1}):{9x+6|5x^2+5x}',['Дужка: {2(x+1)+x|x+1} = {3x+2|x+1}.','Розкладаємо: 9x+6 = 3(3x+2); 5x^2+5x = 5x(x+1).','Ділимо: {3x+2|x+1}·{5x(x+1)|3(3x+2)}. Скорочуємо (3x+2) та (x+1).'],'{5x|3}']]},
{id:'7.19',tab:'7.19–7.20',h:'7.19–7.20: піднесення до степеня',i:'Спочатку спрости дужку, потім степінь діє на чисельник і знаменник. Є ще корисна формула: (u+v)^2−(u−v)^2 = 4uv.',quiz:{q:'({2|x}+1)^2−({2|x}−1)^2 = ?',o:['{8|x}','{4|x}','{4|x^2}','4'],c:0,w:'За формулою 4u, де u = {2|x}. Це {8|x}.'},t:[
['7.19 (1)','({m|n}−{n|m})^2',['Дужка: спільний знаменник mn: {m^2−n^2|mn}.','Степінь до чисельника й знаменника: ({m^2−n^2|mn})^2 = {(m^2−n^2)^2|m^2n^2}.'],'{(m^2−n^2)^2|m^2n^2}'],
['7.19 (2)','({a^2|b}−1)^2+({a^2|b}+1)^2',['Дужки: {a^2−b|b} та {a^2+b|b}.','Степінь: {(a^2−b)^2+(a^2+b)^2|b^2}.','Розкриваємо: a^4−2a^2b+b^2+a^4+2a^2b+b^2 = 2a^4+2b^2.'],'{2(a^4+b^2)|b^2}'],
['7.19 (4)','({a+b|a}+{a−b|b})^2−({a+b|a}−{a−b|b})^2',['Позначимо u = {a+b|a}, v = {a−b|b}. Вираз має вигляд (u+v)^2−(u−v)^2.','Формула: (u+v)^2−(u−v)^2 = 4uv.','4uv = 4·{a+b|a}·{a−b|b} = {4(a+b)(a−b)|ab}.'],'{4(a^2−b^2)|ab}'],
['7.20 (1)','({x|y}+{y|x})^2',['Дужка: {x^2+y^2|xy}.','Степінь: {(x^2+y^2)^2|x^2y^2}.'],'{(x^2+y^2)^2|x^2y^2}'],
['7.20 (2)','({m|n^2}+1)^2−({m|n^2}−1)^2',['Позначимо u = {m|n^2}. Вираз = (u+1)^2−(u−1)^2.','За формулою це 4u (бо (u+1)^2−(u−1)^2 = 2·2u).'],'{4m|n^2}']]},
{id:'7.21',tab:'7.21',h:'7.21: дріб над дробом',i:'Довга риска дробу — це ділення. Окремо спрощуємо верх, окремо низ, потім ділимо.',quiz:{q:'{1−{2|x}|1+{2|x}} = ?',o:['{x−2|x+2}','{x+2|x−2}','−1','{2|x}'],c:0,w:'Верх: {x−2|x}; низ: {x+2|x}. Ділимо, x скорочується.'},t:[
['7.21 (1)','{1−{1|x}|1+{1|x}}',['Верх: 1−{1|x} = {x−1|x}. Низ: 1+{1|x} = {x+1|x}.','Ділимо: {x−1|x}·{x|x+1}. Скорочуємо x.'],'{x−1|x+1}'],
['7.21 (2)','{{7x−a|a}+1|{7x+a|a}−1}',['Верх: {7x−a|a}+1 = {7x−a+a|a} = {7x|a}.','Низ: {7x+a|a}−1 = {7x+a−a|a} = {7x|a}.','Однакові вирази: {7x|a}:{7x|a} = 1.'],'1'],
['7.21 (3)','{{1|p}−{1|2p}|{1|p^2}−{1|2p^2}}',['Верх: {2−1|2p} = {1|2p}.','Низ: {2−1|2p^2} = {1|2p^2}.','Ділимо: {1|2p}·{2p^2|1}. Скорочуємо 2p.'],'p'],
